[package]
name = "beluga-desktop"
version = "0.3.0"
description = "Desktop chat app"
authors = ["Beluga contributors"]
edition = "2024"
default-run = "beluga-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "beluga_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Developer tool, kept out of the app bundle: it builds only with
# `--features vendor-tool`.
[[bin]]
name = "vendor-skills"
path = "src/bin/vendor_skills.rs"
required-features = ["vendor-tool"]

[features]
vendor-tool = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt", "process", "sync", "fs"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
keyring = "4"
eventsource-stream = "0.2"
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
rusqlite = { version = "0.41", features = ["bundled"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
time = "0.3"
tempfile = "3"
flate2 = "1.1.11"
tar = "0.4.46"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
ignore = "0.4.34"
globset = "0.4.21"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
similar = "3"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "process-session", "kill-on-drop", "creation-flags"] }

[target.'cfg(unix)'.dependencies]
# killpg for the command's session, see agent/run.rs
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Only for CREATE_NO_WINDOW, so a command never opens a console window.
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
